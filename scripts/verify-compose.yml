services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: durable_queue_verify
      POSTGRES_USER: durable_queue_verify
      POSTGRES_PASSWORD: durable_queue_verify_password
    ports:
      - "127.0.0.1:${VERIFY_POSTGRES_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U durable_queue_verify -d durable_queue_verify"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
