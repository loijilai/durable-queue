services:
  postgres:
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=durable_queue
      - POSTGRES_USER=durable_queue
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports: # for development
      - "25432:5432"


  sqs:
    image: softwaremill/elasticmq-native:1.6.10
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    ports: # for development
      - "29324:9324"

  api:
    build: . # build context is docker-compose.yml file location
    # 不能用 gunicorn 的預設值（1 個 sync worker、timeout 30 秒）。sync worker
    # accept() 收下連線後就阻塞等 request line，期間不發心跳；瀏覽器為了省下次
    # 握手而預開的連線（preconnect）不送任何資料，足以卡住唯一的 worker，30 秒後
    # 被 master 判死。gthread 用 event loop 管連線，idle socket 不佔住 worker。
    # prod 走 ALB，ALB 不做投機式預連，所以那邊維持原設定（見 infra/api.tf）。
    command: >
      sh -c "python manage.py migrate &&
      gunicorn durable_queue.wsgi:application --bind 0.0.0.0:8000
      --worker-class gthread --workers 2 --threads 4
      --timeout 60 --access-logfile -"
    ports:
      - "8000:8000"
    env_file:
      - .env # load .env at runtime, not COPY into image
    environment: &queue-environment
      - JOB_QUEUE_URL=http://sqs:9324/000000000000/durable-queue-jobs
      # ElasticMQ 的端點與佔位憑證（不是真的 AWS 金鑰），由 botocore 直接讀取
      - AWS_ENDPOINT_URL_SQS=http://sqs:9324
      - AWS_ACCESS_KEY_ID=x
      - AWS_SECRET_ACCESS_KEY=x
      - POSTGRES_HOST=postgres
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_started

  worker:
    build: .
    # 本機專用的 poll shim：呼叫與 Lambda 相同的 handler（jobs.worker）
    command: python manage.py run_worker
    init: true # Python 以 PID 1 執行時會忽略 SIGTERM，交給 init 轉送，stop 才不必等到 SIGKILL
    env_file:
      - .env
    environment: *queue-environment
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_started

volumes:
  pgdata:
