# Local only: ElasticMQ creates the Job queue and its DLQ at startup, with the
# names and retry semantics the lambda-worker spec defines (the Terraform queue
# is renamed to match in ticket 02). maxReceiveCount must equal MAX_ATTEMPTS in
# jobs/worker.py.
include classpath("application.conf")

queues {
  durable-queue-jobs {
    defaultVisibilityTimeout = 900 seconds
    deadLettersQueue {
      name = "durable-queue-jobs-dlq"
      maxReceiveCount = 4
    }
  }
  durable-queue-jobs-dlq {}
}
