# Local only: ElasticMQ creates the Job queue and its DLQ at startup, with the
# names and retry semantics infra/queue.tf declares. maxReceiveCount matches
# queue.tf and only bounds deliveries; jobs/worker.py counts retries by execution.
include classpath("application.conf")

queues {
  durable-queue-jobs {
    defaultVisibilityTimeout = 900 seconds
    deadLettersQueue {
      name = "durable-queue-jobs-dlq"
      maxReceiveCount = 10
    }
  }
  durable-queue-jobs-dlq {}
}
