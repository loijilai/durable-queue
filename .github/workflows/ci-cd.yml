name: CI/CD

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      VERIFY_DATABASE_MODE: external
      POSTGRES_DB: durable_queue
      POSTGRES_USER: durable_queue
      POSTGRES_PASSWORD: durable_queue_test_password
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: durable_queue
          POSTGRES_USER: durable_queue
          POSTGRES_PASSWORD: durable_queue_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U durable_queue -d durable_queue"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13" # 對齊 Dockerfile 的 python:3.13-slim

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.17.1"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Verify repository
        run: ./scripts/verify.sh full

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')

    permissions:
      contents: read
      id-token: write

    environment:
      name: production # require reviewer

    # 放 job 層級，只序列化 deploy（放 workflow 層級會連 test 也一起 gate）。
    # 所有叫做 production-deploy 的 job，同一時間只能有一個執行
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    env:
      AWS_REGION: ap-northeast-1
      ECR_REPO: durable-queue
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::461346075470:role/durable-queue-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          ECR_URI="${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}"
          docker build -t "$ECR_URI:$IMAGE_TAG" -f ./durable_queue/Dockerfile ./durable_queue
          docker push "$ECR_URI:$IMAGE_TAG"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init
          terraform apply -auto-approve -var="image_tag=$IMAGE_TAG"

      # 一次性 task，跑在滾動部署任何 api/worker 實例之前，修正原本「多個
      # 實例可能同時跑 migrate」的競爭條件。
      - name: Run database migration
        working-directory: infra
        run: |
          SUBNETS_JSON="$(terraform output -json private_subnet_ids)"
          SECURITY_GROUP="$(terraform output -raw api_security_group_id)"

          TASK_ARN="$(aws ecs run-task \
            --region "$AWS_REGION" \
            --cluster durable-queue \
            --task-definition durable-queue-migrate \
            --launch-type FARGATE \
            --network-configuration "{\"awsvpcConfiguration\":{\"subnets\":$SUBNETS_JSON,\"securityGroups\":[\"$SECURITY_GROUP\"],\"assignPublicIp\":\"DISABLED\"}}" \
            --query 'tasks[0].taskArn' --output text)"

          aws ecs wait tasks-stopped --region "$AWS_REGION" --cluster durable-queue --tasks "$TASK_ARN"

          EXIT_CODE="$(aws ecs describe-tasks --region "$AWS_REGION" --cluster durable-queue --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' --output text)"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Migration task failed (container exit code $EXIT_CODE)" >&2
            exit 1
          fi

      # force-new-deployment 只是排入滾動更新；service 本身的零停機保證
      # 來自 infra/api.tf 的 deployment_minimum_healthy_percent 設定。
      # `wait services-stable` 讓這步等到新任務全部通過 health check、
      # 舊任務下線為止，部署失敗（新任務一直起不來）才會讓這步逾時失敗。
      - name: Deploy API service
        run: |
          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster durable-queue \
            --service durable-queue-api \
            --force-new-deployment

          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster durable-queue \
            --services durable-queue-api

      - name: Deploy worker service
        run: |
          aws ecs update-service \
            --region "$AWS_REGION" \
            --cluster durable-queue \
            --service durable-queue-worker \
            --force-new-deployment

          aws ecs wait services-stable \
            --region "$AWS_REGION" \
            --cluster durable-queue \
            --services durable-queue-worker
